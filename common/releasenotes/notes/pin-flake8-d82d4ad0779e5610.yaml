---
prelude: >
    Following the latest version of flake8 is normally a good idea, but new
    versions that get released sometimes cause the pipeline to fail.  This is
    a Good Thing (tm) normally, but can be a pain for released branches. 
other:
  - |
    This change pins the version of flake8 to 6.0