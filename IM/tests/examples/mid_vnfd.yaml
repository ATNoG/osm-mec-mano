vnfd:
    description: SFC Middle VNF descriptor
    df:
    - id: default-df
      instantiation-level:
      - id: default-instantiation-level
        vdu-level:
        - number-of-instances: 1
          vdu-id: mid_vnf-VM
      vdu-profile:
      - id: mid_vnf-VM
        min-number-of-instances: 1
    ext-cpd:
    - id: eth0-ext
      int-cpd:
        cpd: eth0-int
        vdu-id: mid_vnf-VM
    id: mid_vnf
    mgmt-cp: eth0-ext
    product-name: mid_vnf
    provider: OSM
    sw-image-desc:
    - id: bionic
      image: bionic
      name: bionic
    - id: ubuntu20.04-aws
      name: ubuntu20.04-aws
      image: ubuntu/images/hvm-ssd/ubuntu-artful-17.10-amd64-server-20180509
      vim-type: aws
    - id: ubuntu20.04-azure
      name: ubuntu20.04-azure
      image: Canonical:0001-com-ubuntu-server-focal:20_04-lts:latest
      vim-type: azure
    vdu:
    - id: mid_vnf-VM
      cloud-init-file: cloud-config
      description: mid_vnf-VM
      int-cpd:
      - id: eth0-int
        virtual-network-interface-requirement:
        - name: eth0
          virtual-interface:
            bandwidth: 0
            type: VIRTIO
            vpci: 0000:00:0a.0
      name: mid_vnf-VM
      sw-image-desc: bionic
      alternative-sw-image-desc:
      - ubuntu20.04-aws
      - ubuntu20.04-azure
      virtual-compute-desc: mid_vnf-VM-compute
      virtual-storage-desc:
      - mid_vnf-VM-storage
    version: '1.0'
    software-version: 1.2
    virtual-compute-desc:
    - id: mid_vnf-VM-compute
      virtual-cpu:
        num-virtual-cpu: 1
      virtual-memory:
        size: 2
    virtual-storage-desc:
    - id: mid_vnf-VM-storage
      size-of-storage: 10
