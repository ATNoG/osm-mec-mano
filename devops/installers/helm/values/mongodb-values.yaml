---
replicaCount: 1
service:
  nameOverride: "mongodb-k8s"
auth:
  enabled: false
architecture: "replicaset"
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 10
  successThreshold: 1
readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 10
  successThreshold: 1

# New bitnami images as they changed the repository name
image:
  repository: bitnamilegacy/mongodb
  
tls:
  image:
    repository: bitnamilegacy/nginx

externalAccess:
  autoDiscovery:
    image:
      repository: bitnamilegacy/kubectl
      
volumePermissions:
  image:
    repository: bitnamilegacy/bitnami-shell

metrics:
  image:
    repository: bitnamilegacy/mongodb-exporter
